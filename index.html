      --serif: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "Cormorant Garamond", "Baskerville", Georgia, serif;

      --brass-bright: #fce5a6;
      --brass-border: rgba(229, 192, 110, 0.38);
      --brass-subtle: rgba(229, 192, 110, 0.18);
      --walnut-glass: rgba(18, 10, 6, 0.76);
      --walnut-deep: rgba(14, 7, 4, 0.92);
      --cream: #f8f0e2;
      --cream-muted: rgba(248, 240, 226, 0.72);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 600px;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #0b0604;
      color: var(--cream);
      font-family: var(--serif);
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    button {
      font-family: inherit;
      touch-action: manipulation;
      cursor: pointer;
    }

    #spatial-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: grab;
      z-index: 1;
    }

    #spatial-canvas:active {
      cursor: grabbing;
    }

    .vignette-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background:
        radial-gradient(ellipse 90% 84% at 50% 48%, rgba(10, 5, 3, 0) 58%, rgba(6, 3, 2, 0.56) 100%),

    }

    /* ==================== TOP MINIMAL BAR ==================== */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;

      align-items: center;

      gap: 8px;
      padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
      pointer-events: none;
    }

    .title-chip {
      pointer-events: auto;
      font-size: clamp(14.5px, 3.6vw, 19px);
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--brass-bright);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.92);
      white-space: nowrap;
      margin: 0;
    }

    .top-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: auto;
    }

    .hud-pill {
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--brass-border);
      background: var(--walnut-glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--cream);
      font-size: 11.5px;
      letter-spacing: 0.03em;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
    }

    .hud-pill.active-mode {
      border-color: var(--brass-bright);
      background: linear-gradient(135deg, rgba(138, 28, 42, 0.86), rgba(58, 24, 14, 0.92));
      color: var(--brass-bright);
    }

    /* ==================== FLOATING TOAST ==================== */

      padding: 7px 15px;
      border-radius: 999px;
      background: rgba(18, 9, 5, 0.90);
      border: 1px solid var(--brass);
      color: var(--brass-bright);
      font-size: 12px;
      letter-spacing: 0.04em;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.7);

      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      max-width: 92vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast-banner.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .bottom-dock {
      position: fixed;
      left: 50%;
      bottom: max(10px, env(safe-area-inset-bottom));
      transform: translateX(-50%);

      border: 1px solid var(--brass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.68);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .bottom-dock.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(20px);
    }

    .music-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--brass-subtle);
    }

    .play-btn {
      padding: 4.5px 11px;
      border-radius: 999px;
      border: 1px solid var(--brass);
      background: linear-gradient(180deg, #4b2916, #281409);
      color: var(--brass-bright);
      font-size: 11.5px;
      white-space: nowrap;
    }

    .track-title-btn {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      color: var(--cream);
      font-size: 12px;
      text-align: left;
      padding: 2px 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-title-btn span {
      color: var(--cream-muted);
      font-size: 11px;
    }

    .mini-pill {
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid var(--brass-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--cream);
      font-size: 11px;
      white-space: nowrap;
    }

    .action-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .dock-btn {
      padding: 5.5px 6px;
      border-radius: 9px;
      border: 1px solid var(--brass-subtle);
      background: rgba(255, 255, 255, 0.04);
      color: var(--cream);
      font-size: 11.5px;
      text-align: center;
      white-space: nowrap;
    }

    .dock-btn:hover {
      background: rgba(229, 192, 110, 0.14);
      border-color: var(--brass);
    }

    /* ==================== REPERTOIRE POPUP SHEET ==================== */
    .repertoire-sheet {
      position: fixed;
      left: 50%;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 88px);
      transform: translateX(-50%) translateY(12px);
      z-index: 25;
      width: min(440px, calc(100vw - 20px));
      max-height: 52dvh;
      overflow-y: auto;
      padding: 12px;
      border-radius: 16px;
      background: var(--walnut-deep);
      border: 1px solid var(--brass);
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.85);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .repertoire-sheet.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--brass-subtle);
      font-size: 12.5px;
      color: var(--brass-bright);
    }

    .track-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      margin-bottom: 4px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.03);
      color: var(--cream);
      text-align: left;
      font-size: 12.5px;

    .track-row.current {
      border-color: var(--brass);
      background: rgba(138, 28, 42, 0.44);
      color: var(--brass-bright);

      color: var(--cream-muted);

      align-items: center;
      gap: 8px;

      pointer-events: auto;

      text-align: center;

      color: var(--brass-bright);
      letter-spacing: 0.06em;

      font-size: 11.5px;
      color: var(--cream-muted);
      letter-spacing: 0.04em;

    .held-pill-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;

      color: var(--brass-bright);
      font-weight: 600;
