<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="黑森林降临节秘柜" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b0604" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕰️</text></svg>" />
  <title>黑森林 24 格机械降临节秘柜 · The Grand Advent Wunderkammer (3D)</title>
  <meta name="description" content="3D 空间立体黑森林巴洛克机械降临节奇珍柜：推开 24 扇立体浮雕金门，镜头推近将 24 件微缩玻璃铜匣奇珍亲手取出捧在掌心 360° 旋转把玩、拧动发条金钥、翻转背面品读守柜人手记。" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://redbookmomo-netizen.github.io/advent-wunderkammer/" />
  <meta property="og:title" content="黑森林 24 格机械降临节秘柜 · The Grand Advent Wunderkammer" />
  <meta property="og:description" content="推开 24 扇 3D 浮雕金门，靠近将微缩奇珍匣取出在掌心 360° 翻转把玩、拧动金钥匙发条、翻看背面铭牌手记。" />
  <meta property="og:image" content="https://redbookmomo-netizen.github.io/advent-wunderkammer/og-cover.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    :root {
      --serif: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "Cormorant Garamond", "Baskerville", Georgia, serif;
      --brass: #e5c06e;
      --brass-bright: #fce5a6;
      --brass-border: rgba(229, 192, 110, 0.38);
      --brass-subtle: rgba(229, 192, 110, 0.18);
      --walnut-glass: rgba(18, 10, 6, 0.76);
      --walnut-deep: rgba(14, 7, 4, 0.92);
      --cream: #f8f0e2;
      --cream-muted: rgba(248, 240, 226, 0.72);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 600px;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #0b0604;
      color: var(--cream);
      font-family: var(--serif);
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    button {
      font-family: inherit;
      touch-action: manipulation;
      cursor: pointer;
    }

    #spatial-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: grab;
      z-index: 1;
    }

    #spatial-canvas:active {
      cursor: grabbing;
    }

    .vignette-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background:
        radial-gradient(ellipse 90% 84% at 50% 48%, rgba(10, 5, 3, 0) 58%, rgba(6, 3, 2, 0.56) 100%),
        linear-gradient(180deg, rgba(10, 5, 3, 0.55) 0%, rgba(10, 5, 3, 0) 12%, rgba(10, 5, 3, 0) 80%, rgba(8, 4, 2, 0.72) 100%);
    }

    /* ==================== TOP MINIMAL BAR ==================== */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
      pointer-events: none;
    }

    .title-chip {
      pointer-events: auto;
      font-size: clamp(14.5px, 3.6vw, 19px);
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--brass-bright);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.92);
      white-space: nowrap;
      margin: 0;
    }

    .top-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: auto;
    }

    .hud-pill {
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--brass-border);
      background: var(--walnut-glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--cream);
      font-size: 11.5px;
      letter-spacing: 0.03em;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
    }

    .hud-pill.active-mode {
      border-color: var(--brass-bright);
      background: linear-gradient(135deg, rgba(138, 28, 42, 0.86), rgba(58, 24, 14, 0.92));
      color: var(--brass-bright);
    }

    /* ==================== FLOATING TOAST ==================== */
    .toast-banner {
      position: fixed;
      top: calc(max(10px, env(safe-area-inset-top)) + 44px);
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      z-index: 30;
      padding: 7px 15px;
      border-radius: 999px;
      background: rgba(18, 9, 5, 0.90);
      border: 1px solid var(--brass);
      color: var(--brass-bright);
      font-size: 12px;
      letter-spacing: 0.04em;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.7);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      max-width: 92vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast-banner.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ==================== OVERVIEW BOTTOM DOCK ==================== */
    .bottom-dock {
      position: fixed;
      left: 50%;
      bottom: max(10px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 16;
      width: min(540px, calc(100vw - 18px));
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 11px;
      border-radius: 15px;
      background: var(--walnut-glass);
      border: 1px solid var(--brass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.68);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .bottom-dock.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(20px);
    }

    .music-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--brass-subtle);
    }

    .play-btn {
      padding: 4.5px 11px;
      border-radius: 999px;
      border: 1px solid var(--brass);
      background: linear-gradient(180deg, #4b2916, #281409);
      color: var(--brass-bright);
      font-size: 11.5px;
      white-space: nowrap;
    }

    .track-title-btn {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      color: var(--cream);
      font-size: 12px;
      text-align: left;
      padding: 2px 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-title-btn span {
      color: var(--cream-muted);
      font-size: 11px;
    }

    .mini-pill {
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid var(--brass-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--cream);
      font-size: 11px;
      white-space: nowrap;
    }

    .action-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .dock-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      padding: 5.5px 4px;
      border-radius: 9px;
      border: 1px solid var(--brass-subtle);
      background: rgba(255, 255, 255, 0.04);
      color: var(--cream);
      font-size: 11px;
      text-align: center;
      white-space: nowrap;
    }

    .dock-btn.edition-link {
      border-color: var(--brass-border);
      background: linear-gradient(135deg, rgba(138, 28, 42, 0.36), rgba(58, 24, 14, 0.48));
      color: var(--brass-bright);
    }

    .dock-btn:hover {
      background: rgba(229, 192, 110, 0.14);
      border-color: var(--brass);
    }

    /* ==================== REPERTOIRE POPUP SHEET ==================== */
    .repertoire-sheet {
      position: fixed;
      left: 50%;
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 88px);
      transform: translateX(-50%) translateY(12px);
      z-index: 25;
      width: min(440px, calc(100vw - 20px));
      max-height: 52dvh;
      overflow-y: auto;
      padding: 12px;
      border-radius: 16px;
      background: var(--walnut-deep);
      border: 1px solid var(--brass);
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.85);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .repertoire-sheet.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--brass-subtle);
      font-size: 12.5px;
      color: var(--brass-bright);
    }

    .track-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      margin-bottom: 4px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.03);
      color: var(--cream);
      text-align: left;
      font-size: 12.5px;
    }

    .track-row.current {
      border-color: var(--brass);
      background: rgba(138, 28, 42, 0.44);
      color: var(--brass-bright);
    }

    .track-row small {
      color: var(--cream-muted);
      font-size: 11px;
    }

    /* ==================== ZERO-CARD FLOATING HAND-PLAY CONTROLS ==================== */
    /* Minimal, frameless floating controls when holding a 3D curio in your hands! */
    .held-hud {
      position: fixed;
      left: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(20px);
      z-index: 18;
      width: min(460px, calc(100vw - 20px));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease, transform 0.28s ease;
    }

    .held-hud.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .held-caption {
      text-align: center;
      pointer-events: none;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.95);
    }

    .held-caption-title {
      margin: 0;
      font-size: 16.5px;
      font-weight: 600;
      color: var(--brass-bright);
      letter-spacing: 0.06em;
    }

    .held-caption-hint {
      margin: 3px 0 0;
      font-size: 11.5px;
      color: var(--cream-muted);
      letter-spacing: 0.04em;
    }

    .held-pill-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
    }

    .ghost-brass-pill {
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid var(--brass-border);
      background: rgba(18, 9, 5, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--cream);
      font-size: 12px;
      letter-spacing: 0.04em;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.65);
      white-space: nowrap;
    }

    .ghost-brass-pill.primary-wind {
      border-color: var(--brass-bright);
      background: linear-gradient(135deg, rgba(142, 27, 46, 0.85), rgba(64, 18, 22, 0.88));
      color: var(--brass-bright);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <canvas id="spatial-canvas" aria-label="黑森林 3D 机械降临节秘柜空间交互舞台"></canvas>
  <div class="vignette-overlay"></div>

  <!-- Minimal Top Header -->
  <header class="top-bar">
    <h1 class="title-chip">黑森林机械降临节秘柜</h1>
    <div class="top-pills">
      <button id="hud-date-btn" type="button" class="hud-pill active-mode" title="切换自由把玩或真实降临节日历锁">
        🗝️ 自由把玩
      </button>
      <button id="hud-mute-btn" type="button" class="hud-pill" title="声效开关">
        🔊 声效
      </button>
    </div>
  </header>

  <div id="toast-banner" class="toast-banner" role="status" aria-live="polite"></div>

  <!-- 8-Piece Repertoire Sheet -->
  <aside id="repertoire-sheet" class="repertoire-sheet" aria-label="八音曲目单">
    <div class="sheet-head">
      <span>🎼 瑞士钢片音梳与木管风琴 · 八首精选名曲</span>
      <button id="close-sheet-btn" type="button" class="mini-pill">收起</button>
    </div>
    <div id="track-list"></div>
  </aside>

  <!-- Overview Bottom Dock -->
  <nav id="bottom-dock" class="bottom-dock" aria-label="秘柜主控栏">
    <div class="music-strip">
      <button id="play-btn" type="button" class="play-btn">▶ 八音奏鸣</button>
      <button id="open-sheet-btn" type="button" class="track-title-btn">
        ♪ <strong id="current-track-title">糖梅仙子之舞</strong> <span id="current-track-idx">(1/8 · 选曲 ▾)</span>
      </button>
      <button id="next-track-btn" type="button" class="mini-pill">⏭ 换曲</button>
    </div>
    <div class="action-strip">
      <button id="finder-btn" type="button" class="dock-btn">✨ 寻门&nbsp;<span id="progress-count">0/24</span></button>
      <button id="cuckoo-btn" type="button" class="dock-btn">🔔 布谷报时</button>
      <button id="all-doors-btn" type="button" class="dock-btn">🚪 全柜盛开</button>
      <a href="./" class="dock-btn edition-link" title="切换回第一版原画精雕典藏版">🖼️ 原画第一版</a>
    </div>
  </nav>

  <!-- Frameless Floating Hand-Play Controls (NO modal card — stays 100% in 3D space!) -->
  <div id="held-hud" class="held-hud" aria-label="掌心奇珍把玩控制">
    <div class="held-caption">
      <h2 id="held-title" class="held-caption-title">No. 01 · 钟罩冰晶冬青玫瑰</h2>
      <p class="held-caption-hint">单指拖动 360° 翻转把玩 · 翻至背面读手记 · 点「放回关门」自动合门</p>
    </div>
    <div class="held-pill-bar">
      <button id="prev-curio-btn" type="button" class="ghost-brass-pill" title="上一件奇珍">◀</button>
      <button id="wind-curio-btn" type="button" class="ghost-brass-pill primary-wind">🔑 拧动发条</button>
      <button id="flip-curio-btn" type="button" class="ghost-brass-pill">🔄 翻看背面</button>
      <button id="put-back-close-btn" type="button" class="ghost-brass-pill">🚪 放回关门</button>
      <button id="put-back-open-btn" type="button" class="ghost-brass-pill">📥 留门</button>
      <button id="next-curio-btn" type="button" class="ghost-brass-pill" title="下一件奇珍">▶</button>
    </div>
  </div>

  <!-- BUNDLE_SCRIPT_PLACEHOLDER -->
</body>
</html>
